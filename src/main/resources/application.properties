# Server Configuration
server.port=3001

# MongoDB Configuration (credentials in URI for authentication)
spring.data.mongodb.uri=${MONGO_URI:mongodb://admin:admin@127.0.0.1:27017/superData?authSource=admin}

# Application Environment
app.environment=${NODE_ENV:development}

# Actuator endpoints (optional - provides /actuator/health, etc.)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
